name: Focused Contract Runner

on:
  pull_request:
    branches:
      - fix/mobile-telegraphs-room-21-50-balance
    types:
      - labeled

permissions:
  contents: read
  pull-requests: read

jobs:
  focused-contract:
    if: startsWith(github.event.label.name, 'focused-contract:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate trigger and derive exact inputs
        id: inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node -e "if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD || '')) process.exit(1)"
          node -e "if (!/^[0-9a-f]{40}$/.test(process.env.BASE_SHA || '')) process.exit(1)"
          node -e "if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER || '')) process.exit(1)"
          node -e "if (!/^focused-contract:[A-Za-z0-9._-]+$/.test(process.env.TRIGGER_LABEL || '')) process.exit(1)"
          test "$BASE_REF" = "fix/mobile-telegraphs-room-21-50-balance"
          CONTRACT_ID="${TRIGGER_LABEL#focused-contract:}"
          test -n "$CONTRACT_ID"
          printf 'contract_id=%s\n' "$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          printf 'expected_head=%s\n' "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR event head
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.expected_head }}
          path: repo
          persist-credentials: false

      - name: Verify checkout and current PR head
        id: head_guard
        env:
          EXPECTED_HEAD: ${{ steps.inputs.outputs.expected_head }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git -C repo rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          CURRENT_PR_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          CURRENT_PR_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
          CURRENT_PR_BASE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"
          printf '%s\n' "$CURRENT_PR_HEAD" > current-pr-head.txt
          printf '%s\n' "$CURRENT_PR_STATE" > current-pr-state.txt
          printf '%s\n' "$CURRENT_PR_BASE" > current-pr-base.txt
          test "$CURRENT_PR_STATE" = "open"
          test "$CURRENT_PR_BASE" = "fix/mobile-telegraphs-room-21-50-balance"
          test "$CURRENT_PR_HEAD" = "$EXPECTED_HEAD"

      - name: Checkout trusted target runner config
        id: config_checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.base_sha }}
          path: runner-config
          persist-credentials: false
          sparse-checkout: |
            .github/focused-contracts.json
          sparse-checkout-cone-mode: false

      - name: Verify trusted runner config head
        id: config_guard
        env:
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
        run: test "$(git -C runner-config rev-parse HEAD)" = "$BASE_SHA"

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Install locked workspace dependencies
        id: install
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: Resolve allowlisted contract from trusted target config
        id: contract
        working-directory: repo
        env:
          CONTRACT_ID: ${{ steps.inputs.outputs.contract_id }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('../runner-config/.github/focused-contracts.json', 'utf8'));
          const entry = manifest.contracts?.[process.env.CONTRACT_ID];
          if (!entry || entry.runner !== 'node-test') throw new Error('contract id is not allowlisted for node-test');
          const normalized = path.posix.normalize(entry.path);
          if (normalized !== entry.path || normalized.startsWith('/') || normalized.startsWith('../') || normalized.includes('/../')) throw new Error('unsafe contract path');
          if (!/^artifacts\/dungeon-rpg\/tests\/[A-Za-z0-9._/-]+\.mjs$/.test(normalized)) throw new Error('contract path outside allowlisted test surface');
          if (!fs.statSync(normalized).isFile()) throw new Error('allowlisted contract is not a file in exact PR head');
          console.log(`path=${normalized}`);
          NODE

      - name: Execute focused contract
        id: execute
        continue-on-error: true
        working-directory: repo
        env:
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
          RECEIPT_DIR: ${{ github.workspace }}/focused-contract-receipt
        run: |
          set -o pipefail
          mkdir -p "$RECEIPT_DIR"
          node --test "$CONTRACT_PATH" 2>&1 | tee "$RECEIPT_DIR/test-output.tap"

      - name: Classify and record terminal result
        id: classify
        if: always()
        env:
          EXPECTED_HEAD: ${{ steps.inputs.outputs.expected_head }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          CONTRACT_ID: ${{ steps.inputs.outputs.contract_id }}
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
          INPUT_OUTCOME: ${{ steps.inputs.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          HEAD_GUARD_OUTCOME: ${{ steps.head_guard.outcome }}
          CONFIG_CHECKOUT_OUTCOME: ${{ steps.config_checkout.outcome }}
          CONFIG_GUARD_OUTCOME: ${{ steps.config_guard.outcome }}
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -u
          mkdir -p focused-contract-receipt

          RESULT="not_executed"
          FAILURE_STAGE="none"

          if [ "$INPUT_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="trigger_validation"
          elif [ "$CHECKOUT_OUTCOME" != "success" ]; then
            RESULT="infrastructure_failure"
            FAILURE_STAGE="checkout"
          elif [ "$HEAD_GUARD_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="head_guard"
          elif [ "$CONFIG_CHECKOUT_OUTCOME" != "success" ]; then
            RESULT="infrastructure_failure"
            FAILURE_STAGE="trusted_config_checkout"
          elif [ "$CONFIG_GUARD_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="trusted_config_guard"
          elif [ "$PNPM_OUTCOME" != "success" ] || [ "$NODE_OUTCOME" != "success" ] || [ "$INSTALL_OUTCOME" != "success" ]; then
            RESULT="infrastructure_failure"
            FAILURE_STAGE="dependency_setup"
          elif [ "$CONTRACT_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="contract_resolution"
          elif [ "$EXECUTE_OUTCOME" = "success" ]; then
            RESULT="executed_pass"
          elif [ "$EXECUTE_OUTCOME" = "failure" ]; then
            RESULT="executed_fail"
            FAILURE_STAGE="contract_execution"
          else
            RESULT="infrastructure_failure"
            FAILURE_STAGE="execution_unavailable"
          fi

          ACTUAL_HEAD=""
          CONFIG_HEAD=""
          MANIFEST_BLOB=""
          CONTRACT_BLOB=""
          CURRENT_PR_HEAD=""
          CURRENT_PR_STATE=""
          CURRENT_PR_BASE=""

          if [ -d repo/.git ]; then
            ACTUAL_HEAD="$(git -C repo rev-parse HEAD 2>/dev/null || true)"
            if [ -n "${CONTRACT_PATH:-}" ]; then
              CONTRACT_BLOB="$(git -C repo rev-parse "HEAD:${CONTRACT_PATH}" 2>/dev/null || true)"
            fi
          fi
          if [ -d runner-config/.git ]; then
            CONFIG_HEAD="$(git -C runner-config rev-parse HEAD 2>/dev/null || true)"
            MANIFEST_BLOB="$(git -C runner-config rev-parse HEAD:.github/focused-contracts.json 2>/dev/null || true)"
          fi
          if [ -f current-pr-head.txt ]; then CURRENT_PR_HEAD="$(cat current-pr-head.txt)"; fi
          if [ -f current-pr-state.txt ]; then CURRENT_PR_STATE="$(cat current-pr-state.txt)"; fi
          if [ -f current-pr-base.txt ]; then CURRENT_PR_BASE="$(cat current-pr-base.txt)"; fi

          export RESULT FAILURE_STAGE ACTUAL_HEAD CONFIG_HEAD MANIFEST_BLOB CONTRACT_BLOB CURRENT_PR_HEAD CURRENT_PR_STATE CURRENT_PR_BASE
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            pr_number: process.env.PR_NUMBER ?? '',
            expected_head: process.env.EXPECTED_HEAD ?? '',
            actual_head: process.env.ACTUAL_HEAD ?? '',
            current_pr_head: process.env.CURRENT_PR_HEAD ?? '',
            current_pr_state: process.env.CURRENT_PR_STATE ?? '',
            current_pr_base: process.env.CURRENT_PR_BASE ?? '',
            trusted_config_expected_head: process.env.BASE_SHA ?? '',
            trusted_config_actual_head: process.env.CONFIG_HEAD ?? '',
            trigger_label: process.env.TRIGGER_LABEL ?? '',
            contract_id: process.env.CONTRACT_ID ?? '',
            contract_path: process.env.CONTRACT_PATH ?? '',
            contract_blob: process.env.CONTRACT_BLOB ?? '',
            manifest_blob: process.env.MANIFEST_BLOB ?? '',
            workflow_run_id: process.env.GITHUB_RUN_ID ?? '',
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT ?? '',
            result: process.env.RESULT ?? 'infrastructure_failure',
            failure_stage: process.env.FAILURE_STAGE ?? 'classification',
            step_outcomes: {
              input: process.env.INPUT_OUTCOME ?? '',
              checkout: process.env.CHECKOUT_OUTCOME ?? '',
              head_guard: process.env.HEAD_GUARD_OUTCOME ?? '',
              trusted_config_checkout: process.env.CONFIG_CHECKOUT_OUTCOME ?? '',
              trusted_config_guard: process.env.CONFIG_GUARD_OUTCOME ?? '',
              pnpm: process.env.PNPM_OUTCOME ?? '',
              node: process.env.NODE_OUTCOME ?? '',
              install: process.env.INSTALL_OUTCOME ?? '',
              contract_resolution: process.env.CONTRACT_OUTCOME ?? '',
              execute: process.env.EXECUTE_OUTCOME ?? '',
            },
          };
          fs.writeFileSync('focused-contract-receipt/receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Upload focused receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-contract-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: focused-contract-receipt/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce focused runner result
        if: always()
        env:
          RESULT: ${{ steps.classify.outputs.result }}
        run: test "$RESULT" = "executed_pass"
