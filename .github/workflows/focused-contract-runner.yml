name: Focused Contract Runner

on:
  pull_request:
    branches:
      - fix/mobile-telegraphs-room-21-50-balance
    types:
      - labeled

permissions:
  contents: read
  pull-requests: read

jobs:
  focused-contract:
    if: startsWith(github.event.label.name, 'focused-contract:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate trigger and derive exact inputs
        id: inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node -e "if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD || '')) process.exit(1)"
          node -e "if (!/^[0-9a-f]{40}$/.test(process.env.BASE_SHA || '')) process.exit(1)"
          node -e "if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER || '')) process.exit(1)"
          node -e "if (!/^focused-contract:[A-Za-z0-9._-]+$/.test(process.env.TRIGGER_LABEL || '')) process.exit(1)"
          test "$BASE_REF" = "fix/mobile-telegraphs-room-21-50-balance"
          CONTRACT_ID="${TRIGGER_LABEL#focused-contract:}"
          test -n "$CONTRACT_ID"
          printf 'contract_id=%s\n' "$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          printf 'expected_head=%s\n' "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR event head
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.expected_head }}
          path: repo
          persist-credentials: false

      - name: Verify checkout and current PR head
        id: head_guard
        env:
          EXPECTED_HEAD: ${{ steps.inputs.outputs.expected_head }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git -C repo rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          CURRENT_PR_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          CURRENT_PR_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
          CURRENT_PR_BASE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"
          printf '%s\n' "$CURRENT_PR_HEAD" > current-pr-head.txt
          printf '%s\n' "$CURRENT_PR_STATE" > current-pr-state.txt
          printf '%s\n' "$CURRENT_PR_BASE" > current-pr-base.txt
          test "$CURRENT_PR_STATE" = "open"
          test "$CURRENT_PR_BASE" = "fix/mobile-telegraphs-room-21-50-balance"
          test "$CURRENT_PR_HEAD" = "$EXPECTED_HEAD"

      - name: Checkout trusted target runner config
        id: config_checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.base_sha }}
          path: runner-config
          persist-credentials: false
          sparse-checkout: |
            .github/focused-contracts.json
          sparse-checkout-cone-mode: false

      - name: Verify trusted runner config head
        id: config_guard
        env:
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
        run: test "$(git -C runner-config rev-parse HEAD)" = "$BASE_SHA"

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Install locked workspace dependencies
        id: install
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: Resolve allowlisted contract from trusted target config
        id: contract
        working-directory: repo
        env:
          CONTRACT_ID: ${{ steps.inputs.outputs.contract_id }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('../runner-config/.github/focused-contracts.json', 'utf8'));
          const entry = manifest.contracts?.[process.env.CONTRACT_ID];
          if (!entry || entry.runner !== 'node-test') throw new Error('contract id is not allowlisted for node-test');
          const normalized = path.posix.normalize(entry.path);
          if (normalized !== entry.path || normalized.startsWith('/') || normalized.startsWith('../') || normalized.includes('/../')) throw new Error('unsafe contract path');
          if (!/^artifacts\/dungeon-rpg\/tests\/[A-Za-z0-9._/-]+\.mjs$/.test(normalized)) throw new Error('contract path outside allowlisted test surface');
          if (!fs.statSync(normalized).isFile()) throw new Error('allowlisted contract is not a file in exact PR head');
          console.log(`path=${normalized}`);
          NODE

      - name: Capture immutable Git identities before execution
        id: identity_capture
        env:
          EXPECTED_HEAD: ${{ steps.inputs.outputs.expected_head }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git -C repo rev-parse HEAD)"
          CONFIG_HEAD="$(git -C runner-config rev-parse HEAD)"
          CONTRACT_BLOB="$(git -C repo rev-parse "HEAD:${CONTRACT_PATH}")"
          MANIFEST_BLOB="$(git -C runner-config rev-parse 'HEAD:.github/focused-contracts.json')"
          CONTRACT_WORKTREE_HASH="$(git -C repo hash-object "$CONTRACT_PATH")"
          MANIFEST_WORKTREE_HASH="$(git -C runner-config hash-object '.github/focused-contracts.json')"

          for value in "$SOURCE_HEAD" "$CONFIG_HEAD" "$CONTRACT_BLOB" "$MANIFEST_BLOB" "$CONTRACT_WORKTREE_HASH" "$MANIFEST_WORKTREE_HASH"; do
            printf '%s\n' "$value" | grep -Eq '^[0-9a-f]{40}$'
          done
          test "$SOURCE_HEAD" = "$EXPECTED_HEAD"
          test "$CONFIG_HEAD" = "$BASE_SHA"
          test "$CONTRACT_WORKTREE_HASH" = "$CONTRACT_BLOB"
          test "$MANIFEST_WORKTREE_HASH" = "$MANIFEST_BLOB"

          printf 'source_head=%s\n' "$SOURCE_HEAD" >> "$GITHUB_OUTPUT"
          printf 'config_head=%s\n' "$CONFIG_HEAD" >> "$GITHUB_OUTPUT"
          printf 'contract_blob=%s\n' "$CONTRACT_BLOB" >> "$GITHUB_OUTPUT"
          printf 'manifest_blob=%s\n' "$MANIFEST_BLOB" >> "$GITHUB_OUTPUT"
          printf 'contract_worktree_hash=%s\n' "$CONTRACT_WORKTREE_HASH" >> "$GITHUB_OUTPUT"
          printf 'manifest_worktree_hash=%s\n' "$MANIFEST_WORKTREE_HASH" >> "$GITHUB_OUTPUT"

      - name: Execute focused contract
        id: execute
        continue-on-error: true
        working-directory: repo
        env:
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
          RECEIPT_DIR: ${{ github.workspace }}/focused-contract-receipt
        run: |
          set -o pipefail
          mkdir -p "$RECEIPT_DIR"
          env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY node --test "$CONTRACT_PATH" 2>&1 | tee "$RECEIPT_DIR/test-output.tap"

      - name: Revalidate Git identities after execution
        id: identity_guard
        if: always()
        continue-on-error: true
        env:
          EXPECTED_HEAD: ${{ steps.inputs.outputs.expected_head }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
          PRE_SOURCE_HEAD: ${{ steps.identity_capture.outputs.source_head }}
          PRE_CONFIG_HEAD: ${{ steps.identity_capture.outputs.config_head }}
          PRE_CONTRACT_BLOB: ${{ steps.identity_capture.outputs.contract_blob }}
          PRE_MANIFEST_BLOB: ${{ steps.identity_capture.outputs.manifest_blob }}
          PRE_CONTRACT_WORKTREE_HASH: ${{ steps.identity_capture.outputs.contract_worktree_hash }}
          PRE_MANIFEST_WORKTREE_HASH: ${{ steps.identity_capture.outputs.manifest_worktree_hash }}
        run: |
          set -u
          POST_SOURCE_HEAD="$(git -C repo rev-parse HEAD 2>/dev/null || true)"
          POST_CONFIG_HEAD="$(git -C runner-config rev-parse HEAD 2>/dev/null || true)"
          POST_CONTRACT_BLOB="$(git -C repo rev-parse "HEAD:${CONTRACT_PATH}" 2>/dev/null || true)"
          POST_MANIFEST_BLOB="$(git -C runner-config rev-parse 'HEAD:.github/focused-contracts.json' 2>/dev/null || true)"
          POST_CONTRACT_WORKTREE_HASH="$(git -C repo hash-object "$CONTRACT_PATH" 2>/dev/null || true)"
          POST_MANIFEST_WORKTREE_HASH="$(git -C runner-config hash-object '.github/focused-contracts.json' 2>/dev/null || true)"

          printf 'source_head=%s\n' "$POST_SOURCE_HEAD" >> "$GITHUB_OUTPUT"
          printf 'config_head=%s\n' "$POST_CONFIG_HEAD" >> "$GITHUB_OUTPUT"
          printf 'contract_blob=%s\n' "$POST_CONTRACT_BLOB" >> "$GITHUB_OUTPUT"
          printf 'manifest_blob=%s\n' "$POST_MANIFEST_BLOB" >> "$GITHUB_OUTPUT"
          printf 'contract_worktree_hash=%s\n' "$POST_CONTRACT_WORKTREE_HASH" >> "$GITHUB_OUTPUT"
          printf 'manifest_worktree_hash=%s\n' "$POST_MANIFEST_WORKTREE_HASH" >> "$GITHUB_OUTPUT"

          set -e
          for value in "$PRE_SOURCE_HEAD" "$PRE_CONFIG_HEAD" "$PRE_CONTRACT_BLOB" "$PRE_MANIFEST_BLOB" "$PRE_CONTRACT_WORKTREE_HASH" "$PRE_MANIFEST_WORKTREE_HASH" "$POST_SOURCE_HEAD" "$POST_CONFIG_HEAD" "$POST_CONTRACT_BLOB" "$POST_MANIFEST_BLOB" "$POST_CONTRACT_WORKTREE_HASH" "$POST_MANIFEST_WORKTREE_HASH"; do
            printf '%s\n' "$value" | grep -Eq '^[0-9a-f]{40}$'
          done
          test "$PRE_SOURCE_HEAD" = "$EXPECTED_HEAD"
          test "$PRE_CONFIG_HEAD" = "$BASE_SHA"
          test "$PRE_CONTRACT_WORKTREE_HASH" = "$PRE_CONTRACT_BLOB"
          test "$PRE_MANIFEST_WORKTREE_HASH" = "$PRE_MANIFEST_BLOB"
          test "$POST_SOURCE_HEAD" = "$PRE_SOURCE_HEAD"
          test "$POST_CONFIG_HEAD" = "$PRE_CONFIG_HEAD"
          test "$POST_CONTRACT_BLOB" = "$PRE_CONTRACT_BLOB"
          test "$POST_MANIFEST_BLOB" = "$PRE_MANIFEST_BLOB"
          test "$POST_CONTRACT_WORKTREE_HASH" = "$PRE_CONTRACT_WORKTREE_HASH"
          test "$POST_MANIFEST_WORKTREE_HASH" = "$PRE_MANIFEST_WORKTREE_HASH"

      - name: Revalidate current PR after execution
        id: final_head_guard
        if: always()
        continue-on-error: true
        env:
          EXPECTED_HEAD: ${{ steps.inputs.outputs.expected_head }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FINAL_PR_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          FINAL_PR_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
          FINAL_PR_BASE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"
          FINAL_GUARD_STATUS="ok"
          if [ "$FINAL_PR_STATE" != "open" ]; then
            FINAL_GUARD_STATUS="state_changed"
          elif [ "$FINAL_PR_BASE" != "fix/mobile-telegraphs-room-21-50-balance" ]; then
            FINAL_GUARD_STATUS="base_changed"
          elif [ "$FINAL_PR_HEAD" != "$EXPECTED_HEAD" ]; then
            FINAL_GUARD_STATUS="head_changed"
          fi
          printf '%s\n' "$FINAL_PR_HEAD" > final-pr-head.txt
          printf '%s\n' "$FINAL_PR_STATE" > final-pr-state.txt
          printf '%s\n' "$FINAL_PR_BASE" > final-pr-base.txt
          printf '%s\n' "$FINAL_GUARD_STATUS" > final-pr-guard-status.txt
          test "$FINAL_GUARD_STATUS" = "ok"

      - name: Classify and record terminal result
        id: classify
        if: always()
        env:
          EXPECTED_HEAD: ${{ steps.inputs.outputs.expected_head }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
          CONTRACT_ID: ${{ steps.inputs.outputs.contract_id }}
          CONTRACT_PATH: ${{ steps.contract.outputs.path }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
          INPUT_OUTCOME: ${{ steps.inputs.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          HEAD_GUARD_OUTCOME: ${{ steps.head_guard.outcome }}
          CONFIG_CHECKOUT_OUTCOME: ${{ steps.config_checkout.outcome }}
          CONFIG_GUARD_OUTCOME: ${{ steps.config_guard.outcome }}
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          IDENTITY_CAPTURE_OUTCOME: ${{ steps.identity_capture.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          IDENTITY_GUARD_OUTCOME: ${{ steps.identity_guard.outcome }}
          FINAL_HEAD_GUARD_OUTCOME: ${{ steps.final_head_guard.outcome }}
          PRE_SOURCE_HEAD: ${{ steps.identity_capture.outputs.source_head }}
          PRE_CONFIG_HEAD: ${{ steps.identity_capture.outputs.config_head }}
          PRE_CONTRACT_BLOB: ${{ steps.identity_capture.outputs.contract_blob }}
          PRE_MANIFEST_BLOB: ${{ steps.identity_capture.outputs.manifest_blob }}
          PRE_CONTRACT_WORKTREE_HASH: ${{ steps.identity_capture.outputs.contract_worktree_hash }}
          PRE_MANIFEST_WORKTREE_HASH: ${{ steps.identity_capture.outputs.manifest_worktree_hash }}
          POST_SOURCE_HEAD: ${{ steps.identity_guard.outputs.source_head }}
          POST_CONFIG_HEAD: ${{ steps.identity_guard.outputs.config_head }}
          POST_CONTRACT_BLOB: ${{ steps.identity_guard.outputs.contract_blob }}
          POST_MANIFEST_BLOB: ${{ steps.identity_guard.outputs.manifest_blob }}
          POST_CONTRACT_WORKTREE_HASH: ${{ steps.identity_guard.outputs.contract_worktree_hash }}
          POST_MANIFEST_WORKTREE_HASH: ${{ steps.identity_guard.outputs.manifest_worktree_hash }}
        run: |
          set -u
          mkdir -p focused-contract-receipt

          RESULT="not_executed"
          FAILURE_STAGE="none"
          FINAL_GUARD_STATUS=""
          if [ -f final-pr-guard-status.txt ]; then FINAL_GUARD_STATUS="$(cat final-pr-guard-status.txt)"; fi

          if [ "$INPUT_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="trigger_validation"
          elif [ "$CHECKOUT_OUTCOME" != "success" ]; then
            RESULT="infrastructure_failure"
            FAILURE_STAGE="checkout"
          elif [ "$HEAD_GUARD_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="head_guard"
          elif [ "$CONFIG_CHECKOUT_OUTCOME" != "success" ]; then
            RESULT="infrastructure_failure"
            FAILURE_STAGE="trusted_config_checkout"
          elif [ "$CONFIG_GUARD_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="trusted_config_guard"
          elif [ "$PNPM_OUTCOME" != "success" ] || [ "$NODE_OUTCOME" != "success" ] || [ "$INSTALL_OUTCOME" != "success" ]; then
            RESULT="infrastructure_failure"
            FAILURE_STAGE="dependency_setup"
          elif [ "$CONTRACT_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="contract_resolution"
          elif [ "$IDENTITY_CAPTURE_OUTCOME" != "success" ]; then
            RESULT="not_executed"
            FAILURE_STAGE="identity_capture"
          elif [ "$FINAL_HEAD_GUARD_OUTCOME" != "success" ]; then
            if [ -n "$FINAL_GUARD_STATUS" ] && [ "$FINAL_GUARD_STATUS" != "ok" ]; then
              RESULT="not_executed"
              FAILURE_STAGE="final_head_guard"
            else
              RESULT="infrastructure_failure"
              FAILURE_STAGE="final_head_revalidation"
            fi
          elif [ "$IDENTITY_GUARD_OUTCOME" != "success" ]; then
            RESULT="infrastructure_failure"
            FAILURE_STAGE="identity_integrity"
          elif [ "$EXECUTE_OUTCOME" = "success" ]; then
            RESULT="executed_pass"
          elif [ "$EXECUTE_OUTCOME" = "failure" ]; then
            RESULT="executed_fail"
            FAILURE_STAGE="contract_execution"
          else
            RESULT="infrastructure_failure"
            FAILURE_STAGE="execution_unavailable"
          fi

          CURRENT_PR_HEAD=""
          CURRENT_PR_STATE=""
          CURRENT_PR_BASE=""
          FINAL_PR_HEAD=""
          FINAL_PR_STATE=""
          FINAL_PR_BASE=""
          if [ -f current-pr-head.txt ]; then CURRENT_PR_HEAD="$(cat current-pr-head.txt)"; fi
          if [ -f current-pr-state.txt ]; then CURRENT_PR_STATE="$(cat current-pr-state.txt)"; fi
          if [ -f current-pr-base.txt ]; then CURRENT_PR_BASE="$(cat current-pr-base.txt)"; fi
          if [ -f final-pr-head.txt ]; then FINAL_PR_HEAD="$(cat final-pr-head.txt)"; fi
          if [ -f final-pr-state.txt ]; then FINAL_PR_STATE="$(cat final-pr-state.txt)"; fi
          if [ -f final-pr-base.txt ]; then FINAL_PR_BASE="$(cat final-pr-base.txt)"; fi

          export RESULT FAILURE_STAGE CURRENT_PR_HEAD CURRENT_PR_STATE CURRENT_PR_BASE FINAL_PR_HEAD FINAL_PR_STATE FINAL_PR_BASE FINAL_GUARD_STATUS
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            pr_number: process.env.PR_NUMBER ?? '',
            expected_head: process.env.EXPECTED_HEAD ?? '',
            actual_head: process.env.POST_SOURCE_HEAD ?? '',
            pre_execution_source_head: process.env.PRE_SOURCE_HEAD ?? '',
            post_execution_source_head: process.env.POST_SOURCE_HEAD ?? '',
            initial_pr_head: process.env.CURRENT_PR_HEAD ?? '',
            initial_pr_state: process.env.CURRENT_PR_STATE ?? '',
            initial_pr_base: process.env.CURRENT_PR_BASE ?? '',
            final_pr_head: process.env.FINAL_PR_HEAD ?? '',
            final_pr_state: process.env.FINAL_PR_STATE ?? '',
            final_pr_base: process.env.FINAL_PR_BASE ?? '',
            final_pr_guard_status: process.env.FINAL_GUARD_STATUS ?? '',
            trusted_config_expected_head: process.env.BASE_SHA ?? '',
            trusted_config_actual_head: process.env.POST_CONFIG_HEAD ?? '',
            pre_execution_config_head: process.env.PRE_CONFIG_HEAD ?? '',
            post_execution_config_head: process.env.POST_CONFIG_HEAD ?? '',
            trigger_label: process.env.TRIGGER_LABEL ?? '',
            contract_id: process.env.CONTRACT_ID ?? '',
            contract_path: process.env.CONTRACT_PATH ?? '',
            contract_blob: process.env.POST_CONTRACT_BLOB ?? '',
            manifest_blob: process.env.POST_MANIFEST_BLOB ?? '',
            pre_execution_contract_blob: process.env.PRE_CONTRACT_BLOB ?? '',
            post_execution_contract_blob: process.env.POST_CONTRACT_BLOB ?? '',
            pre_execution_manifest_blob: process.env.PRE_MANIFEST_BLOB ?? '',
            post_execution_manifest_blob: process.env.POST_MANIFEST_BLOB ?? '',
            pre_execution_contract_worktree_hash: process.env.PRE_CONTRACT_WORKTREE_HASH ?? '',
            post_execution_contract_worktree_hash: process.env.POST_CONTRACT_WORKTREE_HASH ?? '',
            pre_execution_manifest_worktree_hash: process.env.PRE_MANIFEST_WORKTREE_HASH ?? '',
            post_execution_manifest_worktree_hash: process.env.POST_MANIFEST_WORKTREE_HASH ?? '',
            workflow_run_id: process.env.GITHUB_RUN_ID ?? '',
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT ?? '',
            result: process.env.RESULT ?? 'infrastructure_failure',
            failure_stage: process.env.FAILURE_STAGE ?? 'classification',
            step_outcomes: {
              input: process.env.INPUT_OUTCOME ?? '',
              checkout: process.env.CHECKOUT_OUTCOME ?? '',
              head_guard: process.env.HEAD_GUARD_OUTCOME ?? '',
              trusted_config_checkout: process.env.CONFIG_CHECKOUT_OUTCOME ?? '',
              trusted_config_guard: process.env.CONFIG_GUARD_OUTCOME ?? '',
              pnpm: process.env.PNPM_OUTCOME ?? '',
              node: process.env.NODE_OUTCOME ?? '',
              install: process.env.INSTALL_OUTCOME ?? '',
              contract_resolution: process.env.CONTRACT_OUTCOME ?? '',
              identity_capture: process.env.IDENTITY_CAPTURE_OUTCOME ?? '',
              execute: process.env.EXECUTE_OUTCOME ?? '',
              identity_guard: process.env.IDENTITY_GUARD_OUTCOME ?? '',
              final_head_guard: process.env.FINAL_HEAD_GUARD_OUTCOME ?? '',
            },
          };
          fs.writeFileSync('focused-contract-receipt/receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Upload focused receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-contract-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: focused-contract-receipt/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce focused runner result
        if: always()
        env:
          RESULT: ${{ steps.classify.outputs.result }}
        run: test "$RESULT" = "executed_pass"
