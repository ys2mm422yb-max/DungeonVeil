name: Patch PR328 Golden Fracture setpieces

on:
  push:
    branches:
      - feat/rooms-51-60-chapter-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rooms-51-60-chapter-v1
          fetch-depth: 0
      - name: Patch central room setpiece resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/dungeon-rpg/src/game/logicalRoomSetpieces.ts')
          text = path.read_text()
          import_anchor = "import { expandedWorldSetpieces } from './expandedWorldRooms';\n"
          import_replacement = import_anchor + "import { goldenFractureSetpieces } from './goldenFractureSetpieces';\n"
          if "goldenFractureSetpieces" not in text:
              text = text.replace(import_anchor, import_replacement, 1)
          old = """export function logicalRoomSetpieces(room: number): LogicalRoomSetpiece[] {
            const safeRoom = Math.max(1, Math.min(50, room));
            const expanded = expandedWorldSetpieces(safeRoom);
            if (expanded.length) return expanded.map(piece => ({ ...piece }));
            const key = Math.min(20, safeRoom);
          """
          new = """export function logicalRoomSetpieces(room: number): LogicalRoomSetpiece[] {
            const safeRoom = Math.max(1, Math.min(60, room));
            const golden = goldenFractureSetpieces(safeRoom);
            if (golden.length) return golden.map(piece => ({ ...piece }));
            const expanded = expandedWorldSetpieces(safeRoom);
            if (expanded.length) return expanded.map(piece => ({ ...piece }));
            const key = Math.min(20, safeRoom);
          """
          if old not in text:
              raise SystemExit('Expected logicalRoomSetpieces block not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/patch-pr328-logical-setpieces.yml').unlink()
          PY
      - name: Commit focused patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/dungeon-rpg/src/game/logicalRoomSetpieces.ts .github/workflows/patch-pr328-logical-setpieces.yml
          git commit -m "Wire Golden Fracture setpiece resolver"
          git push origin HEAD:feat/rooms-51-60-chapter-v1
