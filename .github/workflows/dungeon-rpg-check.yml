name: Dungeon RPG Check

on:
  push:
    branches: [main, work/blocks-1-7-production-pass, 'fix/**', 'work/block-*']
    paths:
      - 'artifacts/dungeon-rpg/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dungeon-rpg-check.yml'
      - '.github/workflows/dungeon-rpg-ci.yml'
  pull_request:
    branches: [main, work/blocks-1-7-production-pass, 'fix/**', 'work/block-*']
    paths:
      - 'artifacts/dungeon-rpg/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dungeon-rpg-check.yml'
      - '.github/workflows/dungeon-rpg-ci.yml'
      - '.ci/validation-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  support-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/enemy-family-presentation-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enemy-family-presentation-v2
          fetch-depth: 0
      - name: Patch renderer lifecycle and restore workflows
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('artifacts/dungeon-rpg/src/components/GameCanvasKayKit3D.tsx')
          source = path.read_text()
          source = source.replace("const MAX_DAMAGE_VISUALS = IS_ANDROID ? 7 : IS_IOS ? 10 : IS_MOBILE ? 12 : 28;\nconst PERFORMANCE_KEY", "const MAX_DAMAGE_VISUALS = IS_ANDROID ? 7 : IS_IOS ? 10 : IS_MOBILE ? 12 : 28;\nconst ENEMY_VISUAL_RETENTION_MS = 5_000;\nconst PERFORMANCE_KEY", 1)
          source = source.replace("    const enemyVisuals = new Map<string, KayKitEnemyVisual>();\n    const enemyFallbacks", "    const enemyVisuals = new Map<string, KayKitEnemyVisual>();\n    const enemyVisualRetiredAt = new Map<string, number>();\n    const enemyFallbacks", 1)
          old = """      for (const [id, visual] of enemyVisuals) {
        if (active.has(id)) continue;
        scene.remove(visual.root);
        visual.mixer?.stopAllAction?.();
        disposeObject(visual.root);
        enemyVisuals.delete(id);
      }
"""
          new = """      for (const [id, visual] of enemyVisuals) {
        if (active.has(id)) {
          enemyVisualRetiredAt.delete(id);
          visual.root.visible = true;
          continue;
        }
        const retiredAt = enemyVisualRetiredAt.get(id) ?? gameNow;
        enemyVisualRetiredAt.set(id, retiredAt);
        visual.root.visible = false;
        if (gameNow - retiredAt < ENEMY_VISUAL_RETENTION_MS) continue;
        scene.remove(visual.root);
        visual.mixer?.stopAllAction?.();
        disposeObject(visual.root);
        enemyVisuals.delete(id);
        enemyVisualRetiredAt.delete(id);
      }
"""
          if old not in source:
              raise SystemExit('enemy visual removal block no longer matches')
          path.write_text(source.replace(old, new, 1))
          contract = Path('artifacts/dungeon-rpg/scripts/validate-complete-loading.mjs')
          audit = contract.read_text()
          needle = "if (enemyLoader.includes('new GLTFLoader().loadAsync(enemyAssetUrl(type))')) failures.push('imported model parsing still performs a second network request');"
          addition = "\nif (!canvas.includes('ENEMY_VISUAL_RETENTION_MS') || !canvas.includes('enemyVisualRetiredAt') || !canvas.includes('visual.root.visible = false')) failures.push('short spectator layout churn can recreate and leak enemy textures instead of retaining the existing visual');"
          if needle not in audit:
              raise SystemExit('validator insertion point no longer matches')
          contract.write_text(audit.replace(needle, needle + addition, 1))
          PY
          git show HEAD^:.github/workflows/dungeon-rpg-check.yml > .github/workflows/dungeon-rpg-check.yml
          rm -f .github/workflows/support-fix-spectator-retention.yml
          git config user.name "dungeon-veil-support-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/dungeon-rpg/src/components/GameCanvasKayKit3D.tsx artifacts/dungeon-rpg/scripts/validate-complete-loading.mjs .github/workflows/dungeon-rpg-check.yml .github/workflows/support-fix-spectator-retention.yml
          git commit -m "fix: retain transient spectator enemy visuals"
          git push origin HEAD:feat/enemy-family-presentation-v2

  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Asset audit
        run: pnpm --filter @workspace/dungeon-rpg audit:assets
      - name: Write KayKit animation inventory
        run: node artifacts/dungeon-rpg/scripts/inventory-kaykit-animation-clips.mjs --out artifacts/dungeon-rpg/kaykit-animation-inventory.json
      - name: Upload KayKit animation inventory
        uses: actions/upload-artifact@v4
        with:
          name: kaykit-animation-inventory-${{ github.sha }}
          path: artifacts/dungeon-rpg/kaykit-animation-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Room and collision audit
        run: pnpm --filter @workspace/dungeon-rpg audit:rooms
      - name: Typecheck Dungeon Veil
        run: pnpm --filter @workspace/dungeon-rpg typecheck
      - name: Build Dungeon Veil
        run: pnpm --filter @workspace/dungeon-rpg build
