name: Dungeon RPG Check

on:
  push:
    branches: [main, work/blocks-1-7-production-pass, 'fix/**', 'work/block-*']
    paths:
      - 'artifacts/dungeon-rpg/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dungeon-rpg-check.yml'
      - '.github/workflows/dungeon-rpg-ci.yml'
  pull_request:
    branches: [main, work/blocks-1-7-production-pass, 'fix/**', 'work/block-*']
    paths:
      - 'artifacts/dungeon-rpg/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dungeon-rpg-check.yml'
      - '.github/workflows/dungeon-rpg-ci.yml'
      - '.ci/validation-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-spectator-retention-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/enemy-family-presentation-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Apply production fix and focused contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          canvas_path = Path('artifacts/dungeon-rpg/src/components/GameCanvasKayKit3D.tsx')
          source = canvas_path.read_text()
          source = source.replace(
              "const LOW_GPU_KEY = 'dungeon-veil-low-gpu';\n",
              "const LOW_GPU_KEY = 'dungeon-veil-low-gpu';\nconst ENEMY_VISUAL_RETENTION_MS = 5_000;\n",
              1,
          )
          source = source.replace(
              "    const enemyLoading = new Set<string>();\n",
              "    const enemyLoading = new Set<string>();\n    const enemyMissingSince = new Map<string, number>();\n",
              1,
          )
          old_cleanup = """      const active = new Set(state.enemies.map(enemy => enemy.id));
      for (const [id, visual] of enemyVisuals) {
        if (active.has(id)) continue;
        scene.remove(visual.root);
        visual.mixer?.stopAllAction?.();
        disposeObject(visual.root);
        enemyVisuals.delete(id);
      }
      for (const [id, fallback] of enemyFallbacks) {
        if (active.has(id)) continue;
        scene.remove(fallback);
        disposeObject(fallback);
        enemyFallbacks.delete(id);
      }
      for (const [id, shell] of enemySafetyShells) {
        if (active.has(id)) continue;
        scene.remove(shell);
        disposeObject(shell);
        enemySafetyShells.delete(id);
      }

      for (const enemy of state.enemies) {
"""
          new_cleanup = """      const active = new Set(state.enemies.map(enemy => enemy.id));
      const shouldRetainMissingEnemy = (id: string) => {
        const missingSince = enemyMissingSince.get(id) ?? gameNow;
        enemyMissingSince.set(id, missingSince);
        return gameNow - missingSince < ENEMY_VISUAL_RETENTION_MS;
      };
      for (const [id, visual] of enemyVisuals) {
        if (active.has(id)) continue;
        visual.root.visible = false;
        if (shouldRetainMissingEnemy(id)) continue;
        scene.remove(visual.root);
        visual.mixer?.stopAllAction?.();
        disposeObject(visual.root);
        enemyVisuals.delete(id);
      }
      for (const [id, fallback] of enemyFallbacks) {
        if (active.has(id)) continue;
        fallback.visible = false;
        if (shouldRetainMissingEnemy(id)) continue;
        scene.remove(fallback);
        disposeObject(fallback);
        enemyFallbacks.delete(id);
      }
      for (const [id, shell] of enemySafetyShells) {
        if (active.has(id)) continue;
        shell.visible = false;
        if (shouldRetainMissingEnemy(id)) continue;
        scene.remove(shell);
        disposeObject(shell);
        enemySafetyShells.delete(id);
      }
      for (const [id, missingSince] of enemyMissingSince) {
        if (active.has(id)) enemyMissingSince.delete(id);
        else if (gameNow - missingSince >= ENEMY_VISUAL_RETENTION_MS
          && !enemyVisuals.has(id) && !enemyFallbacks.has(id) && !enemySafetyShells.has(id)) enemyMissingSince.delete(id);
      }

      for (const enemy of state.enemies) {
        enemyMissingSince.delete(enemy.id);
        const retainedVisual = enemyVisuals.get(enemy.id);
        if (retainedVisual) retainedVisual.root.visible = true;
        const retainedFallback = enemyFallbacks.get(enemy.id);
        if (retainedFallback) retainedFallback.visible = true;
        const retainedShell = enemySafetyShells.get(enemy.id);
        if (retainedShell) retainedShell.visible = true;
"""
          if old_cleanup not in source:
              raise SystemExit('enemy cleanup contract not found')
          source = source.replace(old_cleanup, new_cleanup, 1)
          old_created = """          createKayKitEnemyVisual(THREE, enemy).then(created => {
            enemyLoading.delete(enemy.id);
            if (!created || disposed || !stateRef.current.enemies.some(current => current.id === enemy.id)) return;
            const fallback = enemyFallbacks.get(enemy.id);
"""
          new_created = """          createKayKitEnemyVisual(THREE, enemy).then(created => {
            enemyLoading.delete(enemy.id);
            if (!created) return;
            if (disposed) {
              disposeObject(created.root);
              return;
            }
            const stillActive = stateRef.current.enemies.some(current => current.id === enemy.id);
            if (!stillActive) {
              enemyMissingSince.set(enemy.id, performance.now());
              created.root.visible = false;
            }
            const fallback = enemyFallbacks.get(enemy.id);
"""
          if old_created not in source:
              raise SystemExit('enemy async creation contract not found')
          source = source.replace(old_created, new_created, 1)
          canvas_path.write_text(source)

          validator_path = Path('artifacts/dungeon-rpg/scripts/validate-complete-loading.mjs')
          validator = validator_path.read_text()
          needle = "    'currentRoomEnemyFamilyIds(gameState)',\n"
          addition = """    'currentRoomEnemyFamilyIds(gameState)',
    'const ENEMY_VISUAL_RETENTION_MS = 5_000;',
    'const enemyMissingSince = new Map<string, number>();',
    'visual.root.visible = false;',
    'if (retainedVisual) retainedVisual.root.visible = true;',
"""
          if needle not in validator:
              raise SystemExit('validator insertion point not found')
          validator = validator.replace(needle, addition, 1)
          validator_path.write_text(validator)
          PY
      - name: Restore workflow and push focused commit
        shell: bash
        run: |
          git checkout HEAD^ -- .github/workflows/dungeon-rpg-check.yml
          git config user.name 'dungeon-veil-autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/dungeon-rpg/src/components/GameCanvasKayKit3D.tsx artifacts/dungeon-rpg/scripts/validate-complete-loading.mjs .github/workflows/dungeon-rpg-check.yml
          git commit -m 'fix: retain spectator enemy visuals across packet gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Asset audit
        run: pnpm --filter @workspace/dungeon-rpg audit:assets
      - name: Write KayKit animation inventory
        run: node artifacts/dungeon-rpg/scripts/inventory-kaykit-animation-clips.mjs --out artifacts/dungeon-rpg/kaykit-animation-inventory.json
      - name: Upload KayKit animation inventory
        uses: actions/upload-artifact@v4
        with:
          name: kaykit-animation-inventory-${{ github.sha }}
          path: artifacts/dungeon-rpg/kaykit-animation-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Room and collision audit
        run: pnpm --filter @workspace/dungeon-rpg audit:rooms
      - name: Typecheck Dungeon Veil
        run: pnpm --filter @workspace/dungeon-rpg typecheck
      - name: Build Dungeon Veil
        run: pnpm --filter @workspace/dungeon-rpg build
