name: Block 14 Guild Raid Boss Rewards

on:
  pull_request:
    branches:
      - fix/mobile-telegraphs-room-21-50-balance
    paths:
      - 'artifacts/dungeon-rpg/src/components/GuildRaidRunPanel.tsx'
      - 'artifacts/dungeon-rpg/src/game/guildRaidBoss.ts'
      - 'artifacts/dungeon-rpg/src/game/guildRaidBossOnline.ts'
      - 'artifacts/dungeon-rpg/scripts/validate-block-14-guild-raid-boss-rewards.mjs'
      - 'supabase/migrations/20260726213000_guild_raid_boss_rewards_block_14.sql'
      - '.github/workflows/block-14-guild-raid-boss-rewards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-block-14:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate Block 14 contract
        working-directory: artifacts/dungeon-rpg
        run: node scripts/validate-block-14-guild-raid-boss-rewards.mjs
      - name: Typecheck
        run: pnpm --filter @workspace/dungeon-rpg typecheck
      - name: Build
        run: pnpm --filter @workspace/dungeon-rpg build
