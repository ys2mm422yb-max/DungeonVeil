name: Product Autopilot QA

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-telegraphs-room-21-50-balance
    paths:
      - '.github/workflows/product-autopilot-qa.yml'
      - 'artifacts/dungeon-rpg/**'
      - 'supabase/migrations/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/mobile-telegraphs-room-21-50-balance
    paths:
      - '.github/workflows/product-autopilot-qa.yml'
      - 'artifacts/dungeon-rpg/**'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.55.0'
  BASE_PATH: /DungeonVeil/
  DUNGEON_VEIL_URL: http://127.0.0.1:4173/DungeonVeil/

jobs:
  product-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate repository evidence budgets
        run: node artifacts/dungeon-rpg/scripts/validate-evidence-budget-contracts.mjs
      - name: Verify product evidence file manifest
        run: node artifacts/dungeon-rpg/scripts/create-product-evidence-file-manifest.mjs --self-test
      - name: Verify focused UX contracts
        run: node artifacts/dungeon-rpg/tests/guild-mail-equipment-ux-contract.mjs
      - name: Verify TypeScript
        run: pnpm run typecheck
      - name: Build GitHub Pages output once
        run: |
          BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg run build
          test -f artifacts/dungeon-rpg/dist/public/index.html
          grep -q '/DungeonVeil/' artifacts/dungeon-rpg/dist/public/index.html
      - name: Upload shared production output
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-veil-product-build-${{ github.sha }}
          retention-days: 1
          compression-level: 9
          path: artifacts/dungeon-rpg/dist/public
      - name: Audit product contracts
        run: |
          pnpm --filter @workspace/dungeon-rpg audit:assets
          pnpm --filter @workspace/dungeon-rpg audit:social
          pnpm --filter @workspace/dungeon-rpg audit:coop-realtime
          pnpm --filter @workspace/dungeon-rpg audit:economy
          pnpm --filter @workspace/dungeon-rpg audit:rooms
          pnpm --filter @workspace/dungeon-rpg audit:worldboss
          pnpm --filter @workspace/dungeon-rpg audit:spectator

  automatic-product-journeys:
    needs: product-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - project: iphone-webkit
            browser: webkit
          - project: android-chromium
            browser: chromium
          - project: ipad-portrait-webkit
            browser: webkit
          - project: android-tablet-chromium
            browser: chromium
    env:
      BROWSER_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install deterministic browser runner
        run: pnpm --dir artifacts/dungeon-rpg add -D @playwright/test@${PLAYWRIGHT_VERSION} --lockfile=false
      - name: Restore browser engine cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Install browser system dependencies
        run: .github/scripts/install-playwright-deps-bounded.sh "${{ matrix.browser }}"
      - name: Install browser engine
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --dir artifacts/dungeon-rpg exec playwright install ${{ matrix.browser }}
      - name: Provision deterministic video encoder
        shell: bash
        run: bash .github/scripts/install-ffmpeg-bounded.sh
      - name: Download shared production output
        uses: actions/download-artifact@v4
        with:
          name: dungeon-veil-product-build-${{ github.sha }}
          path: artifacts/dungeon-rpg/dist/public
      - name: Run portrait-mobile product journeys
        id: product-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 > /tmp/dungeon-veil-product-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent "$DUNGEON_VEIL_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail "$DUNGEON_VEIL_URL" > /dev/null
          timeout --signal=TERM --kill-after=30s 55m pnpm --dir artifacts/dungeon-rpg exec playwright test \
            tests/autopilot-product-journeys.spec.mjs \
            tests/run-gift-authority.spec.mjs \
            tests/autopilot-outside-guild.spec.mjs \
            tests/guild-mail-equipment-visual.spec.mjs \
            tests/mobile-resource-upgrade.spec.mjs \
            tests/companion-runtime.spec.mjs \
            tests/companion-free-movement-evidence.spec.mjs \
            tests/spectator-performance.spec.mjs \
            tests/spectator-death-state.spec.mjs \
            tests/player-death-state.spec.mjs \
            tests/upgrade-prestige-visual.spec.mjs \
            tests/upgrade-prestige-mobile-hotfix.spec.mjs \
            tests/visible-upgrade-prestige.spec.mjs \
            tests/kaykit-chapter-evidence.spec.mjs \
            tests/guild-raid-lobby-mobile.spec.mjs \
            tests/armor-cloud-restore-render.spec.mjs \
            --config=playwright.regression.config.mjs \
            --project="$BROWSER_PROJECT" \
            2>&1 | tee "/tmp/dungeon-veil-product-playwright-${BROWSER_PROJECT}.log"
      - name: Prove post-rearm runtime monitor fails closed
        if: steps.product-tests.outcome == 'success' && (matrix.project == 'iphone-webkit' || matrix.project == 'android-chromium')
        shell: bash
        run: |
          set -euo pipefail
          probe_log="/tmp/dungeon-veil-runtime-monitor-negative-probe-${BROWSER_PROJECT}.log"
          BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 > "/tmp/dungeon-veil-negative-probe-preview-${BROWSER_PROJECT}.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent "$DUNGEON_VEIL_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail "$DUNGEON_VEIL_URL" > /dev/null
          set +e
          DUNGEON_VEIL_RUNTIME_MONITOR_NEGATIVE_PROBE=1 \
            timeout --signal=TERM --kill-after=30s 12m pnpm --dir artifacts/dungeon-rpg exec playwright test \
            tests/autopilot-product-journeys.spec.mjs \
            --config=playwright.regression.config.mjs \
            --project="$BROWSER_PROJECT" \
            --grep "signed-out hub, solo run and duo entry remain functional" \
            --reporter=line \
            2>&1 | tee "$probe_log"
          probe_status=${PIPESTATUS[0]}
          set -e
          test "$probe_status" -eq 1
          grep -F "pageerror: dungeon-veil-post-reload-runtime-monitor-probe" "$probe_log"
      - name: Resolve focused evidence requirements
        id: evidence-requirements
        if: steps.product-tests.outcome == 'success'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          let selected = null;
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            const eventPath = process.env.GITHUB_EVENT_PATH;
            if (eventPath && fs.existsSync(eventPath)) {
              const payload = JSON.parse(fs.readFileSync(eventPath, 'utf8'));
              const body = payload?.pull_request?.body ?? '';
              const startMarker = '<!-- product-autopilot-selection:start -->';
              const endMarker = '<!-- product-autopilot-selection:end -->';
              const start = body.indexOf(startMarker);
              const end = body.indexOf(endMarker);
              if (start >= 0 && end > start) {
                const block = body.slice(start + startMarker.length, end);
                if (!/\bFULL_PRODUCT_AUTOPILOT\b/.test(block)) {
                  const specs = [...block.matchAll(/`tests\/([A-Za-z0-9._/-]+\.spec\.mjs)`/g)].map((match) => match[1]);
                  if (specs.length > 0) selected = new Set(specs);
                }
              }
            }
          }

          const required = (spec) => selected === null || selected.has(spec);
          const outputs = [
            `spectator_performance=${required('spectator-performance.spec.mjs')}`,
            `spectator_death=${required('spectator-death-state.spec.mjs')}`,
            `player_death=${required('player-death-state.spec.mjs')}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${outputs.join('\n')}\n`);
          console.log(selected === null
            ? 'Product evidence requirements: full fail-closed suite.'
            : `Product evidence requirements: adaptive selection (${[...selected].join(', ')}).`);
          NODE
      - name: Collect focused spectator review screenshots
        if: steps.product-tests.outcome == 'success' && steps.evidence-requirements.outputs.spectator_performance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t spectator_pngs < <(find artifacts/dungeon-rpg/test-results -type f -name "autopilot-spectator-companion-*-${BROWSER_PROJECT}.png" -print0)
          test "${#spectator_pngs[@]}" -eq 7
          for png in "${spectator_pngs[@]}"; do
            target="artifacts/dungeon-rpg/test-results/$(basename "$png")"
            if [[ "$png" != "$target" ]]; then
              mv "$png" "$target"
            fi
          done
      - name: Collect focused spectator death review screenshot
        if: steps.product-tests.outcome == 'success' && steps.evidence-requirements.outputs.spectator_death == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t spectator_death_pngs < <(find artifacts/dungeon-rpg/test-results -type f -name "autopilot-spectator-death-state-${BROWSER_PROJECT}.png" -print0)
          test "${#spectator_death_pngs[@]}" -eq 1
          target="artifacts/dungeon-rpg/test-results/autopilot-spectator-death-state-${BROWSER_PROJECT}.png"
          if [[ "${spectator_death_pngs[0]}" != "$target" ]]; then
            mv "${spectator_death_pngs[0]}" "$target"
          fi
      - name: Collect focused player death review evidence
        if: steps.product-tests.outcome == 'success' && steps.evidence-requirements.outputs.player_death == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t death_pngs < <(find artifacts/dungeon-rpg/test-results -type f -name "player-death-solo-${BROWSER_PROJECT}.png" -print0)
          mapfile -d '' -t death_videos < <(find artifacts/dungeon-rpg/test-results -type f -path '*player-death-state*' -name 'video.webm' -print0)
          mapfile -d '' -t death_traces < <(find artifacts/dungeon-rpg/test-results -type f -name "player-death-solo-${BROWSER_PROJECT}.trace.json" -print0)
          test "${#death_pngs[@]}" -eq 1
          test "${#death_videos[@]}" -eq 1
          test "${#death_traces[@]}" -eq 1
          mv "${death_pngs[0]}" "artifacts/dungeon-rpg/test-results/player-death-solo-${BROWSER_PROJECT}.png"
          mv "${death_videos[0]}" "artifacts/dungeon-rpg/test-results/player-death-solo-${BROWSER_PROJECT}.webm"
          mv "${death_traces[0]}" "artifacts/dungeon-rpg/test-results/player-death-solo-${BROWSER_PROJECT}.trace.json"
      - name: Prepare compact companion prestige review video
        if: steps.product-tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t raw_videos < <(find artifacts/dungeon-rpg/test-results -type f -name video.webm -print)
          base_sha=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base_sha="${{ github.event.before }}"
          fi
          if [[ -n "$base_sha" && "$base_sha" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$base_sha"
            mapfile -t changed_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
            if ! printf '%s\n' "${changed_files[@]}" | grep -Eiq 'prestige|companionUpgradePrestige3D|upgrade-prestige|visible-upgrade'; then
              find artifacts/dungeon-rpg/test-results -type f \
                \( -name "visual-upgrade-prestige-*-${BROWSER_PROJECT}.png" -o -name "visible-prestige-*-${BROWSER_PROJECT}.png" \) \
                -delete
              rm -f "${raw_videos[@]}"
              echo "No prestige-affecting changes; omitting unrelated prestige review media from success evidence."
              exit 0
            fi
          fi
          test "${#raw_videos[@]}" -eq 1
          output="artifacts/dungeon-rpg/test-results/visual-upgrade-prestige-${BROWSER_PROJECT}.webm"
          ffmpeg -hide_banner -loglevel error -y -i "${raw_videos[0]}" \
            -vf "scale='min(540,iw)':-2:flags=lanczos" \
            -c:v libvpx-vp9 -crf 36 -b:v 0 -an "$output"
          rm -f "${raw_videos[0]}"
          test -s "$output"
      - name: Losslessly compact successful PNG evidence
        if: steps.product-tests.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          declare -a pngs=()
          mapfile -d '' -t pngs < <(find artifacts/dungeon-rpg/test-results -type f -name '*.png' -print0) || true
          for png in "${pngs[@]}"; do
            if [[ ! -f "$png" ]]; then
              echo "::warning file=$png::Skipping PNG compaction because the source file disappeared."
              continue
            fi
            tmp=""
            if ! tmp="$(mktemp --suffix=.png)"; then
              echo "::warning file=$png::Skipping PNG compaction because temporary file creation failed."
              continue
            fi
            if ! before_size="$(stat -c '%s' "$png")"; then
              echo "::warning file=$png::Skipping PNG compaction because source size lookup failed."
              rm -f "$tmp" || true
              continue
            fi
            if ! before_pixels="$(ffmpeg -hide_banner -loglevel error -i "$png" -vf format=rgba -f framemd5 - | tail -n 1)"; then
              echo "::warning file=$png::Skipping PNG compaction because canonical decode failed."
              rm -f "$tmp" || true
              continue
            fi
            if ! ffmpeg -hide_banner -loglevel error -y -i "$png" -frames:v 1 -c:v png -compression_level 9 "$tmp"; then
              echo "::warning file=$png::Skipping PNG compaction because lossless re-encode failed."
              rm -f "$tmp" || true
              continue
            fi
            if ! after_pixels="$(ffmpeg -hide_banner -loglevel error -i "$tmp" -vf format=rgba -f framemd5 - | tail -n 1)"; then
              echo "::warning file=$png::Skipping PNG compaction because compacted decode failed."
              rm -f "$tmp" || true
              continue
            fi
            if [[ "$before_pixels" != "$after_pixels" ]]; then
              echo "::warning file=$png::Skipping PNG compaction because decoded RGBA pixels differ."
              rm -f "$tmp" || true
              continue
            fi
            if ! after_size="$(stat -c '%s' "$tmp")"; then
              echo "::warning file=$png::Skipping PNG compaction because compacted size lookup failed."
              rm -f "$tmp" || true
              continue
            fi
            if (( after_size < before_size )); then
              if ! mv "$tmp" "$png"; then
                echo "::warning file=$png::Skipping PNG compaction because replacement failed."
                rm -f "$tmp" || true
                continue
              fi
            else
              rm -f "$tmp" || true
            fi
          done
          exit 0
      - name: Upload compact product result manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-autopilot-results-${{ matrix.project }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          path: artifacts/dungeon-rpg/test-results/full-game-results.json
      - name: Generate deterministic evidence file manifest
        if: steps.product-tests.outcome == 'success'
        run: >-
          node artifacts/dungeon-rpg/scripts/create-product-evidence-file-manifest.mjs
          artifacts/dungeon-rpg/test-results
          artifacts/dungeon-rpg/test-results/product-evidence-file-manifest-${{ matrix.project }}.json
      - name: Enforce successful product evidence budget
        if: steps.product-tests.outcome == 'success'
        run: >-
          node artifacts/dungeon-rpg/scripts/assert-artifact-budget.mjs
          --max-mb 100
          --label "product-success-${{ matrix.project }}"
          artifacts/dungeon-rpg/test-results
      - name: Upload successful portrait screenshots and review video
        if: steps.product-tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: product-autopilot-evidence-${{ matrix.project }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          path: |
            artifacts/dungeon-rpg/test-results/autopilot-*-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/visual-*-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/visible-prestige-*-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/chapter-evidence-*-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/mobile-resource-upgrade-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/companion-damage-feedback-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/companion-damage-feedback-critical-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/armor-cloud-restore-painted-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/player-death-solo-${{ matrix.project }}.png
            artifacts/dungeon-rpg/test-results/player-death-solo-${{ matrix.project }}.webm
            artifacts/dungeon-rpg/test-results/player-death-solo-${{ matrix.project }}.trace.json
            artifacts/dungeon-rpg/test-results/visual-upgrade-prestige-${{ matrix.project }}.webm
            artifacts/dungeon-rpg/test-results/product-evidence-file-manifest-${{ matrix.project }}.json
      - name: Enforce focused product failure budget
        if: steps.product-tests.outcome == 'failure'
        run: >-
          node artifacts/dungeon-rpg/scripts/assert-artifact-budget.mjs
          --max-mb 350
          --label "product-failure-${{ matrix.project }}"
          artifacts/dungeon-rpg/test-results
          "/tmp/dungeon-veil-product-playwright-${BROWSER_PROJECT}.log"
          /tmp/dungeon-veil-product-preview.log
      - name: Upload focused failure diagnostics
        if: steps.product-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: product-autopilot-failure-${{ matrix.project }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          path: |
            artifacts/dungeon-rpg/test-results/full-game-results.json
            artifacts/dungeon-rpg/test-results/**/trace.zip
            artifacts/dungeon-rpg/test-results/**/*.webm
            artifacts/dungeon-rpg/test-results/**/test-failed-*.png
            /tmp/dungeon-veil-product-playwright-${BROWSER_PROJECT}.log
            /tmp/dungeon-veil-product-preview.log
      - name: Fail product journeys after diagnostics
        if: steps.product-tests.outcome == 'failure'
        run: exit 1