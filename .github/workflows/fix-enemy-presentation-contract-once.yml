name: Fix enemy presentation contract once

on:
  push:
    branches:
      - feat/enemy-family-presentation-v2
    paths:
      - .github/workflows/fix-enemy-presentation-contract-once.yml

permissions:
  contents: write

concurrency:
  group: fix-enemy-presentation-contract-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enemy-family-presentation-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact starting head
        run: test "$(git rev-parse HEAD)" = "6c1032ea770bef2cdd91f930e36e2b36ffd3f526"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply canonical presentation contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('artifacts/dungeon-rpg')
          registry_path = root / 'src/game/enemyRegistry.ts'
          regional_path = root / 'src/game/enemyRegionalIdentity.ts'
          contract_path = root / 'src/game/enemyPresentationContract.ts'
          validator_path = root / 'scripts/validate-enemy-visual-variety.mjs'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          def replace_exact_count(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrences, found {count}')
              return text.replace(old, new)

          if contract_path.exists():
              raise SystemExit('enemyPresentationContract.ts already exists; refusing non-idempotent repair')

          contract_path.write_text("""import type { EnemyFamilyId } from './enemyRegistry';

/**
 * Canonical presentation identity for every authored enemy family.
 *
 * Runtime EnemyType values remain coarse simulation carriers. These keys are
 * deliberately independent and are the only normal-family presentation-key
 * literals used by the registry and renderer.
 */
export const ENEMY_PRESENTATION_KEY_BY_FAMILY = {
  'slime': 'crypt-slime',
  'goblin': 'crypt-goblin-skirmisher',
  'cave-bat': 'crypt-cave-bat',
  'thorn-crawler': 'crypt-thorn-crawler',
  'skeleton': 'grave-skeleton-guard',
  'bone-archer': 'grave-bone-archer',
  'crypt-acolyte': 'grave-crypt-acolyte',
  'grave-hound': 'grave-hound',
  'orc': 'marsh-orc-raider',
  'spider': 'marsh-spider',
  'briar-shaman': 'marsh-briar-shaman',
  'boar-brute': 'marsh-boar-brute',
  'vampire': 'darkwood-vampire-stalker',
  'shadow-rogue': 'darkwood-shadow-rogue',
  'dusk-mage': 'darkwood-dusk-mage',
  'carrion-swarm': 'darkwood-carrion-swarm',
  'demon': 'ember-demon-serpent',
  'veil-cultist': 'ember-veil-cultist',
  'golem': 'ember-stone-golem',
  'flame-imp': 'ember-flame-imp',
  'gilded-sentinel': 'fracture-gilded-sentinel',
  'fracture-wisp': 'fracture-wisp',
  'crystal-lancer': 'fracture-crystal-lancer',
  'star-seer': 'astral-star-seer',
  'astral-mote': 'astral-mote',
  'void-knight': 'astral-void-knight',
  'drowned-revenant': 'reliquary-drowned-revenant',
  'tidecaller': 'reliquary-tidecaller',
  'chain-crab': 'reliquary-chain-crab',
  'cinder-knight': 'cinder-knight',
  'furnace-hound': 'cinder-furnace-hound',
  'ember-witch': 'cinder-ember-witch',
  'veil-aberration': 'nexus-veil-aberration',
  'nexus-herald': 'nexus-herald',
  'rift-beast': 'nexus-rift-beast',
  'boss': 'boss-family',
} as const satisfies Record<EnemyFamilyId, string>;

export type EnemyPresentationKey = (typeof ENEMY_PRESENTATION_KEY_BY_FAMILY)[EnemyFamilyId];

export function enemyPresentationKeyForFamily(id: EnemyFamilyId): EnemyPresentationKey {
  return ENEMY_PRESENTATION_KEY_BY_FAMILY[id];
}
""", encoding='utf-8')

          registry = registry_path.read_text(encoding='utf-8')
          registry = replace_once(
              registry,
              'export const RUNTIME_ENEMY_TYPES = [',
              "import { enemyPresentationKeyForFamily, type EnemyPresentationKey } from './enemyPresentationContract';\n\nexport const RUNTIME_ENEMY_TYPES = [",
              'registry contract import',
          )
          registry = replace_once(registry, '  presentationKey: EnemyType;', '  presentationKey: EnemyPresentationKey;', 'registry presentation type')
          registry = replace_once(registry, 'id, runtimeType, presentationKey: runtimeType, silhouette', 'id, runtimeType, presentationKey: enemyPresentationKeyForFamily(id), silhouette', 'registry family assignment')
          registry = replace_once(registry, "id: 'boss', runtimeType: 'boss', presentationKey: 'boss', silhouette", "id: 'boss', runtimeType: 'boss', presentationKey: enemyPresentationKeyForFamily('boss'), silhouette", 'registry boss assignment')
          if 'presentationKey: runtimeType' in registry:
              raise SystemExit('runtimeType presentation fallback remains in registry')
          registry_path.write_text(registry, encoding='utf-8')

          regional = regional_path.read_text(encoding='utf-8')
          regional = replace_once(
              regional,
              "} from './enemyRegistry';\n",
              "} from './enemyRegistry';\nimport { enemyPresentationKeyForFamily, type EnemyPresentationKey } from './enemyPresentationContract';\n",
              'regional contract import',
          )
          regional = replace_once(
              regional,
              '  presentationKey: string;',
              '  presentationKey: EnemyPresentationKey | `boss-${string}` | `legacy-${EnemyType}`;',
              'regional presentation type',
          )
          regional = replace_exact_count(
              regional,
              '  presentationKey: string,',
              "  presentationKey: EnemyVisualProfile['presentationKey'],",
              3,
              'regional builder parameter types',
          )
          regional = replace_once(
              regional,
              'const realMage = (presentationKey: string, attackProfile: EnemyAttackPattern, scaleMultiplier = 1): EnemyVisualProfile =>',
              "const realMage = (presentationKey: EnemyVisualProfile['presentationKey'], attackProfile: EnemyAttackPattern, scaleMultiplier = 1): EnemyVisualProfile =>",
              'regional mage parameter type',
          )

          real_mage_definition = """const realMage = (presentationKey: EnemyVisualProfile['presentationKey'], attackProfile: EnemyAttackPattern, scaleMultiplier = 1): EnemyVisualProfile =>
  adventurer(presentationKey, 'mage', '/characters/gltf/mage.glb', attackProfile, 'staff', scaleMultiplier);
"""
          family_builders = """
function familyCreature(
  familyId: NormalEnemyFamilyId,
  role: EnemyVisualRole,
  attackProfile: EnemyAttackPattern,
  scaleMultiplier = 1,
): EnemyVisualProfile {
  return creature(enemyPresentationKeyForFamily(familyId), role, attackProfile, scaleMultiplier);
}

function familySkeleton(
  familyId: NormalEnemyFamilyId,
  role: EnemyVisualRole,
  model: keyof typeof SKELETON_EXTRA_MODEL,
  attackProfile: EnemyAttackPattern,
  weaponProfile: EnemyWeaponProfile,
  scaleMultiplier = 1,
): EnemyVisualProfile {
  return skeleton(enemyPresentationKeyForFamily(familyId), role, model, attackProfile, weaponProfile, scaleMultiplier);
}

function familyAdventurer(
  familyId: NormalEnemyFamilyId,
  role: EnemyVisualRole,
  modelToken: string,
  attackProfile: EnemyAttackPattern,
  weaponProfile: EnemyWeaponProfile,
  scaleMultiplier = 1,
): EnemyVisualProfile {
  return adventurer(enemyPresentationKeyForFamily(familyId), role, modelToken, attackProfile, weaponProfile, scaleMultiplier);
}

const familyRealMage = (familyId: NormalEnemyFamilyId, attackProfile: EnemyAttackPattern, scaleMultiplier = 1): EnemyVisualProfile =>
  realMage(enemyPresentationKeyForFamily(familyId), attackProfile, scaleMultiplier);
"""
          regional = replace_once(regional, real_mage_definition, real_mage_definition + family_builders, 'family presentation builders')

          matrix_start = regional.index('export const ENEMY_FAMILY_PRESENTATIONS = {')
          matrix_end = regional.index('\n} satisfies Record<NormalEnemyFamilyId, EnemyVisualProfile>;', matrix_start)
          matrix = regional[matrix_start:matrix_end]
          entry_pattern = re.compile(r"^(\s{2})(?P<key>'[^']+'|[a-z][a-z0-9-]*): (?P<builder>creature|skeleton|adventurer|realMage)\(\s*'[^']+'", re.MULTILINE)
          builder_names = {
              'creature': 'familyCreature',
              'skeleton': 'familySkeleton',
              'adventurer': 'familyAdventurer',
              'realMage': 'familyRealMage',
          }

          def family_entry(match: re.Match[str]) -> str:
              raw_key = match.group('key')
              family_id = raw_key[1:-1] if raw_key.startswith("'") else raw_key
              return f"{match.group(1)}{raw_key}: {builder_names[match.group('builder')]}('{family_id}'"

          matrix, changed = entry_pattern.subn(family_entry, matrix)
          if changed != 35:
              raise SystemExit(f'presentation matrix: expected 35 canonical family rewrites, found {changed}')
          if re.search(r"^\s{2}(?:'[^']+'|[a-z][a-z0-9-]*):\s*(?:creature|skeleton|adventurer|realMage)\(", matrix, re.MULTILINE):
              raise SystemExit('presentation matrix still contains direct presentation-key builders')
          regional = regional[:matrix_start] + matrix + regional[matrix_end:]
          regional_path.write_text(regional, encoding='utf-8')

          validator = validator_path.read_text(encoding='utf-8')
          validator = replace_once(
              validator,
              'const [registry, visual, baseVisual, regional, encounters, runEngine, codex, retention, familyRuntime, telegraphs, entities, persistentSave, manifest] = await Promise.all([',
              'const [registry, presentationContract, visual, baseVisual, regional, encounters, runEngine, codex, retention, familyRuntime, telegraphs, entities, persistentSave, manifest] = await Promise.all([',
              'validator contract variable',
          )
          validator = replace_once(
              validator,
              "  read('../src/game/enemyRegistry.ts'), read('../src/components/kaykitEnemy3D.ts'), read('../src/components/kaykitEnemyBase3D.ts'),",
              "  read('../src/game/enemyRegistry.ts'), read('../src/game/enemyPresentationContract.ts'), read('../src/components/kaykitEnemy3D.ts'), read('../src/components/kaykitEnemyBase3D.ts'),",
              'validator contract source',
          )

          section_start = validator.index('const presentationBlock = regional.match(')
          section_end_marker = "if (regional.includes('if (safeRoom <= 10)') || regional.includes('function lateRegistryVisual')) failures.push('legacy room/type visual branching still bypasses the family presentation matrix');\n"
          section_end = validator.index(section_end_marker, section_start) + len(section_end_marker)
          contract_checks = r"""const contractBlock = presentationContract.match(/export const ENEMY_PRESENTATION_KEY_BY_FAMILY = \{([\s\S]*?)\n\} as const satisfies Record<EnemyFamilyId, string>;/)?.[1] ?? '';
const contractMatches = [...contractBlock.matchAll(/^\s{2}'([^']+)':\s*'([^']+)',?$/gm)];
const presentationByFamily = new Map(contractMatches.map(match => [match[1], match[2]]));
const allContractKeys = new Set(contractMatches.map(match => match[2]));
const normalPresentationKeys = families.map(family => presentationByFamily.get(family.id)).filter(Boolean);
const presentationKeys = new Set(normalPresentationKeys);

const presentationBlock = regional.match(/export const ENEMY_FAMILY_PRESENTATIONS = \{([\s\S]*?)\n\} satisfies Record<NormalEnemyFamilyId, EnemyVisualProfile>;/)?.[1] ?? '';
const presentationMatches = [...presentationBlock.matchAll(/^\s{2}(?:'([^']+)'|([a-z][a-z0-9-]*)):\s*family(?:Creature|Skeleton|Adventurer|RealMage)\(\s*'([^']+)'/gm)];
const presentations = presentationMatches.map(match => ({
  familyId: match[1] || match[2],
  helperFamilyId: match[3],
  presentationKey: presentationByFamily.get(match[1] || match[2]),
}));
const presentationFamilies = new Set(presentations.map(entry => entry.familyId));

if (!presentationContract.includes("import type { EnemyFamilyId } from './enemyRegistry';")) failures.push('presentation contract is not typed against the canonical family registry');
if (contractMatches.length !== families.length + 1) failures.push(`presentation contract contains ${contractMatches.length} entries for ${families.length + 1} families including boss`);
if (presentationByFamily.size !== contractMatches.length) failures.push('presentation contract contains duplicate family ids');
if (allContractKeys.size !== contractMatches.length) failures.push(`presentation contract keys are not unique: ${allContractKeys.size}/${contractMatches.length}`);
if (presentationByFamily.get('boss') !== 'boss-family') failures.push('boss family lacks a canonical presentation identity');

for (const family of families) {
  const presentationKey = presentationByFamily.get(family.id);
  if (!presentationKey) failures.push(`${family.id} has no canonical presentation key`);
  if (presentationKey === family.runtimeType) failures.push(`${family.id} still falls back to runtime type ${family.runtimeType} as its presentation key`);
}

if (!registry.includes('presentationKey: EnemyPresentationKey;')) failures.push('EnemyFamilyDefinition.presentationKey is not separated from EnemyType');
if (registry.includes('presentationKey: runtimeType')) failures.push('registry still assigns presentation identity from runtimeType');
if (!registry.includes('presentationKey: enemyPresentationKeyForFamily(id)')) failures.push('normal registry families do not consume the canonical presentation contract');
if (!registry.includes("presentationKey: enemyPresentationKeyForFamily('boss')")) failures.push('boss registry family does not consume the canonical presentation contract');
if (!regional.includes("from './enemyPresentationContract'")) failures.push('renderer does not import the canonical presentation contract');
if (!regional.includes('enemyPresentationKeyForFamily(familyId)')) failures.push('renderer family builders do not resolve canonical presentation identity');

if (!regional.includes('ENEMY_FAMILY_PRESENTATIONS')) failures.push('canonical family presentation matrix is missing');
if (presentations.length !== families.length) failures.push(`presentation matrix contains ${presentations.length} entries for ${families.length} normal families`);
for (const entry of presentations) {
  if (entry.familyId !== entry.helperFamilyId) failures.push(`${entry.familyId} presentation helper is incorrectly bound to ${entry.helperFamilyId}`);
}
for (const family of families) {
  if (!presentationFamilies.has(family.id)) failures.push(`${family.id} has no explicit visual presentation profile`);
}
if (presentationKeys.size !== presentations.length) failures.push(`presentation keys are not unique: ${presentationKeys.size}/${presentations.length}`);
if (presentationKeys.size < 30) failures.push(`only ${presentationKeys.size} distinct presentation keys are registered; expected at least 30`);
if (/^\s{2}(?:'[^']+'|[a-z][a-z0-9-]*):\s*(?:creature|skeleton|adventurer|realMage)\(/m.test(presentationBlock)) failures.push('family matrix duplicates presentation-key literals instead of using the canonical contract');
if (!regional.includes('explicitFamilyId ?? enemyFamilyForSpawn')) failures.push('visual resolution does not prefer explicit canonical family identity');
if (regional.includes('if (safeRoom <= 10)') || regional.includes('function lateRegistryVisual')) failures.push('legacy room/type visual branching still bypasses the family presentation matrix');
"""
          validator = validator[:section_start] + contract_checks + validator[section_end:]
          validator_path.write_text(validator, encoding='utf-8')
          PY

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Verify presentation contract
        run: |
          node artifacts/dungeon-rpg/scripts/validate-enemy-visual-variety.mjs
          node artifacts/dungeon-rpg/scripts/validate-enemy-visibility.mjs
          pnpm --dir artifacts/dungeon-rpg run typecheck
          pnpm --dir artifacts/dungeon-rpg run build

      - name: Commit verified repair
        shell: bash
        run: |
          rm .github/workflows/fix-enemy-presentation-contract-once.yml
          git config user.name "Dungeon Veil Contract Repair"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/dungeon-rpg/src/game/enemyPresentationContract.ts \
                  artifacts/dungeon-rpg/src/game/enemyRegistry.ts \
                  artifacts/dungeon-rpg/src/game/enemyRegionalIdentity.ts \
                  artifacts/dungeon-rpg/scripts/validate-enemy-visual-variety.mjs \
                  .github/workflows/fix-enemy-presentation-contract-once.yml
          git commit -m "fix: separate enemy presentation identity"
          git push origin HEAD:feat/enemy-family-presentation-v2
