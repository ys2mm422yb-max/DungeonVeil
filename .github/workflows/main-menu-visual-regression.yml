name: Main Menu Visual Regression

on:
  push:
    branches: ['feat/live-hybrid-main-menu-v3', 'feat/block-20-live-main-menu-v1', 'fix/**']
    paths:
      - '.github/workflows/main-menu-visual-regression.yml'
      - 'artifacts/dungeon-rpg/package.json'
      - 'artifacts/dungeon-rpg/playwright.regression.config.mjs'
      - 'artifacts/dungeon-rpg/public/assets/hall/**'
      - 'artifacts/dungeon-rpg/scripts/validate-block-20-main-menu.mjs'
      - 'artifacts/dungeon-rpg/src/components/MainMenuDungeonScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/LiveHybridMainMenuScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/ProfileBadge.tsx'
      - 'artifacts/dungeon-rpg/src/components/mainMenuPresentation.css'
      - 'artifacts/dungeon-rpg/src/components/kaykitVillagePlayer3D.ts'
      - 'artifacts/dungeon-rpg/src/components/kaykitWeapons3D.ts'
      - 'artifacts/dungeon-rpg/src/components/screens/MainMenuScreen.tsx'
      - 'artifacts/dungeon-rpg/src/game/companionCollectionV5.ts'
      - 'artifacts/dungeon-rpg/src/game/optionalEquipmentState.ts'
      - 'artifacts/dungeon-rpg/src/index.css'
      - 'artifacts/dungeon-rpg/tests/block-20-main-menu.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-audit.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-render-readiness.mjs'
  pull_request:
    branches: [main, 'fix/**', 'work/block-*']
    paths:
      - '.github/workflows/main-menu-visual-regression.yml'
      - 'artifacts/dungeon-rpg/package.json'
      - 'artifacts/dungeon-rpg/playwright.regression.config.mjs'
      - 'artifacts/dungeon-rpg/public/assets/hall/**'
      - 'artifacts/dungeon-rpg/scripts/validate-block-20-main-menu.mjs'
      - 'artifacts/dungeon-rpg/src/components/MainMenuDungeonScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/LiveHybridMainMenuScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/ProfileBadge.tsx'
      - 'artifacts/dungeon-rpg/src/components/mainMenuPresentation.css'
      - 'artifacts/dungeon-rpg/src/components/kaykitVillagePlayer3D.ts'
      - 'artifacts/dungeon-rpg/src/components/kaykitWeapons3D.ts'
      - 'artifacts/dungeon-rpg/src/components/screens/MainMenuScreen.tsx'
      - 'artifacts/dungeon-rpg/src/game/companionCollectionV5.ts'
      - 'artifacts/dungeon-rpg/src/game/optionalEquipmentState.ts'
      - 'artifacts/dungeon-rpg/src/index.css'
      - 'artifacts/dungeon-rpg/tests/block-20-main-menu.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-audit.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-render-readiness.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-static:
    name: build-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate focused Block 20 contract
        run: node artifacts/dungeon-rpg/scripts/validate-block-20-main-menu.mjs
      - name: Build current branch once
        run: BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg run build
      - name: Upload reusable menu build
        uses: actions/upload-artifact@v4
        with:
          name: block20-menu-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
          path: artifacts/dungeon-rpg/dist

  mobile-main-menu-evidence:
    name: ${{ matrix.project }}-menu-evidence
    needs: build-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: iphone-webkit
            browser: webkit
          - project: android-chromium
            browser: chromium
          - project: ipad-portrait-webkit
            browser: webkit
          - project: android-tablet-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install isolated browser test runner
        run: pnpm --dir artifacts/dungeon-rpg add -D @playwright/test@1.55.0 --lockfile=false
      - name: Install matrix browser
        run: pnpm --dir artifacts/dungeon-rpg exec playwright install --with-deps ${{ matrix.browser }}
      - name: Download exact-head menu build
        uses: actions/download-artifact@v4
        with:
          name: block20-menu-build-${{ github.sha }}
          path: artifacts/dungeon-rpg/dist
      - name: Capture focused four-device Block 20 evidence
        env:
          DUNGEON_VEIL_URL: http://127.0.0.1:4173/DungeonVeil/
          BASE_PATH: /DungeonVeil/
        shell: bash
        run: |
          BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 > /tmp/dungeon-veil-block20-${{ matrix.project }}.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/DungeonVeil/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/DungeonVeil/ > /dev/null
          pnpm --dir artifacts/dungeon-rpg exec playwright test tests/block-20-main-menu.spec.mjs --config=playwright.regression.config.mjs --project=${{ matrix.project }}
      - name: Upload focused Block 20 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block20-${{ matrix.project }}-visual-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: artifacts/dungeon-rpg/test-results/block20-*-${{ matrix.project }}.png
      - name: Upload focused Block 20 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block20-${{ matrix.project }}-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/dungeon-rpg/test-results/full-game-results.json
            artifacts/dungeon-rpg/test-results/**/trace.zip
            artifacts/dungeon-rpg/test-results/**/*.webm
            artifacts/dungeon-rpg/playwright-report/**
            /tmp/dungeon-veil-block20-${{ matrix.project }}.log
