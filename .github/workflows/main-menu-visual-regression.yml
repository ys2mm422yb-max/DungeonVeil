name: Main Menu Visual Regression

on:
  push:
    branches: ['feat/live-hybrid-main-menu-v3', 'feat/block-20-live-main-menu-v1', 'fix/**']
    paths:
      - '.github/workflows/main-menu-visual-regression.yml'
      - 'artifacts/dungeon-rpg/package.json'
      - 'artifacts/dungeon-rpg/playwright.regression.config.mjs'
      - 'artifacts/dungeon-rpg/public/assets/hall/**'
      - 'artifacts/dungeon-rpg/scripts/validate-block-20-main-menu.mjs'
      - 'artifacts/dungeon-rpg/src/components/MainMenuDungeonScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/LiveHybridMainMenuScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/ProfileBadge.tsx'
      - 'artifacts/dungeon-rpg/src/components/mainMenuPresentation.css'
      - 'artifacts/dungeon-rpg/src/components/kaykitVillagePlayer3D.ts'
      - 'artifacts/dungeon-rpg/src/components/kaykitWeapons3D.ts'
      - 'artifacts/dungeon-rpg/src/components/screens/MainMenuScreen.tsx'
      - 'artifacts/dungeon-rpg/src/game/companionCollectionV5.ts'
      - 'artifacts/dungeon-rpg/src/game/optionalEquipmentState.ts'
      - 'artifacts/dungeon-rpg/src/index.css'
      - 'artifacts/dungeon-rpg/tests/block-20-main-menu.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-audit.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-render-readiness.mjs'
  pull_request:
    branches: [main, 'fix/**', 'work/block-*']
    paths:
      - '.github/workflows/main-menu-visual-regression.yml'
      - 'artifacts/dungeon-rpg/package.json'
      - 'artifacts/dungeon-rpg/playwright.regression.config.mjs'
      - 'artifacts/dungeon-rpg/public/assets/hall/**'
      - 'artifacts/dungeon-rpg/scripts/validate-block-20-main-menu.mjs'
      - 'artifacts/dungeon-rpg/src/components/MainMenuDungeonScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/LiveHybridMainMenuScene.tsx'
      - 'artifacts/dungeon-rpg/src/components/ProfileBadge.tsx'
      - 'artifacts/dungeon-rpg/src/components/mainMenuPresentation.css'
      - 'artifacts/dungeon-rpg/src/components/kaykitVillagePlayer3D.ts'
      - 'artifacts/dungeon-rpg/src/components/kaykitWeapons3D.ts'
      - 'artifacts/dungeon-rpg/src/components/screens/MainMenuScreen.tsx'
      - 'artifacts/dungeon-rpg/src/game/companionCollectionV5.ts'
      - 'artifacts/dungeon-rpg/src/game/optionalEquipmentState.ts'
      - 'artifacts/dungeon-rpg/src/index.css'
      - 'artifacts/dungeon-rpg/tests/block-20-main-menu.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-audit.spec.mjs'
      - 'artifacts/dungeon-rpg/tests/visual-render-readiness.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.55.0'

jobs:
  build-and-static:
    name: build-and-static
    # Keep the prerequisite build on the same supported runner as the four-device evidence jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate repository evidence budgets
        run: node artifacts/dungeon-rpg/scripts/validate-evidence-budget-contracts.mjs
      - name: Validate focused Block 20 contract
        run: node artifacts/dungeon-rpg/scripts/validate-block-20-main-menu.mjs
      - name: Build current branch once
        run: BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg run build
      - name: Upload reusable menu build
        uses: actions/upload-artifact@v4
        with:
          name: block20-menu-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
          path: artifacts/dungeon-rpg/dist

  mobile-main-menu-evidence:
    name: ${{ matrix.project }}-menu-evidence
    needs: build-and-static
    # Playwright 1.55 WebKit dependencies are supported on Ubuntu 24.04; ubuntu-latest may resolve to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - project: iphone-webkit
            browser: webkit
          - project: android-chromium
            browser: chromium
          - project: ipad-portrait-webkit
            browser: webkit
          - project: android-tablet-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install isolated browser test runner
        run: pnpm --dir artifacts/dungeon-rpg add -D @playwright/test@${PLAYWRIGHT_VERSION} --lockfile=false
      - name: Restore browser engine cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Install browser system dependencies
        run: pnpm --dir artifacts/dungeon-rpg exec playwright install-deps ${{ matrix.browser }}
      - name: Install browser engine
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --dir artifacts/dungeon-rpg exec playwright install ${{ matrix.browser }}
      - name: Download exact-head menu build
        uses: actions/download-artifact@v4
        with:
          name: block20-menu-build-${{ github.sha }}
          path: artifacts/dungeon-rpg/dist
      - name: Capture focused four-device Block 20 evidence
        id: menu-tests
        continue-on-error: true
        env:
          DUNGEON_VEIL_URL: http://127.0.0.1:4173/DungeonVeil/
          BASE_PATH: /DungeonVeil/
        shell: bash
        run: |
          BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 > /tmp/dungeon-veil-block20-${{ matrix.project }}.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/DungeonVeil/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/DungeonVeil/ > /dev/null
          timeout --signal=TERM --kill-after=30s 25m pnpm --dir artifacts/dungeon-rpg exec playwright test \
            tests/block-20-main-menu.spec.mjs \
            --config=playwright.regression.config.mjs \
            --project=${{ matrix.project }}
      # Diagnostic only: enumerate every PNG, including the 32 Playwright attachments,
      # before the binding budget gate. Do not delete, resize or recompress evidence.
      - name: Report exact PNG evidence sizes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('artifacts/dungeon-rpg/test-results')
          files = sorted(root.rglob('*.png'), key=lambda p: (-p.stat().st_size, str(p)))
          print(f'PNG evidence inventory: {len(files)} files; {sum(p.stat().st_size for p in files)} bytes total')
          for path in files:
              print(f'{path.stat().st_size:>12} {path.relative_to(root)}')
          PY
      - name: Upload compact Block 20 result manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block20-${{ matrix.project }}-results
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          path: artifacts/dungeon-rpg/test-results/full-game-results.json
      # Curate full-resolution motion attachments separately from raw Playwright diagnostics.
      # Preserve source bytes and provenance; do not change the binding budget inventory.
      - name: Curate Block 20 motion attachment originals
        if: steps.menu-tests.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from shutil import copyfile
          import json
          root = Path('artifacts/dungeon-rpg/test-results')
          output = Path('artifacts/dungeon-rpg/curated-block20-attachments')
          output.mkdir(parents=True, exist_ok=True)
          sources = sorted(p for p in root.rglob('*.png') if p.parent != root)
          if not sources:
              raise SystemExit('Missing original Playwright motion PNG attachments')
          manifest = []
          for index, source in enumerate(sources):
              destination = output / f'motion-attachment-{index:03d}.png'
              copyfile(source, destination)
              original = source.read_bytes()
              if destination.read_bytes() != original:
                  raise SystemExit(f'Attachment copy mismatch: {source}')
              manifest.append({'source': str(source.relative_to(root)), 'file': destination.name, 'bytes': len(original), 'sha256': sha256(original).hexdigest()})
          (output / 'manifest.json').write_text(json.dumps({'version': 1, 'attachments': manifest}, indent=2) + '\n')
          print(f'Curated {len(manifest)} original full-resolution PNG attachments with SHA-256 provenance')
          PY
      # Preserve exact-head original media even when the binding 100-MiB gate fails.
      # Upload success does not override the subsequent budget failure.
      - name: Upload focused Block 20 visual evidence
        if: steps.menu-tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: block20-${{ matrix.project }}-visual-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          path: |
            artifacts/dungeon-rpg/test-results/block20-*-${{ matrix.project }}.png
            artifacts/dungeon-rpg/curated-block20-attachments/*.png
            artifacts/dungeon-rpg/curated-block20-attachments/manifest.json
            artifacts/dungeon-rpg/test-results/*/video.webm
      - name: Enforce focused Block 20 success budget
        if: steps.menu-tests.outcome == 'success'
        run: >-
          node artifacts/dungeon-rpg/scripts/assert-artifact-budget.mjs
          --max-mb 100
          --label "block20-success-${{ matrix.project }}"
          artifacts/dungeon-rpg/test-results
      - name: Enforce focused Block 20 failure budget
        if: steps.menu-tests.outcome == 'failure'
        run: >-
          node artifacts/dungeon-rpg/scripts/assert-artifact-budget.mjs
          --max-mb 350
          --label "block20-failure-${{ matrix.project }}"
          artifacts/dungeon-rpg/test-results
          "/tmp/dungeon-veil-block20-${{ matrix.project }}.log"
      - name: Upload focused Block 20 diagnostics
        if: steps.menu-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: block20-${{ matrix.project }}-diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
          path: |
            artifacts/dungeon-rpg/test-results/full-game-results.json
            artifacts/dungeon-rpg/test-results/**/trace.zip
            artifacts/dungeon-rpg/test-results/**/*.webm
            artifacts/dungeon-rpg/test-results/**/test-failed-*.png
            /tmp/dungeon-veil-block20-${{ matrix.project }}.log
      - name: Fail Block 20 evidence after diagnostics
        if: steps.menu-tests.outcome == 'failure'
        run: exit 1
