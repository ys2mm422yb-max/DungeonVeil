name: Block 15 Controlled KayKit Integration

on:
  pull_request:
    branches:
      - fix/mobile-telegraphs-room-21-50-balance
    paths:
      - 'artifacts/dungeon-rpg/public/assets/kaykit-controlled/**'
      - 'artifacts/dungeon-rpg/src/game/controlledKayKitRegistry.ts'
      - 'artifacts/dungeon-rpg/scripts/validate-block-15-controlled-kaykit.mjs'
      - '.github/workflows/block-15-controlled-kaykit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-controlled-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate controlled KayKit contract
        run: node artifacts/dungeon-rpg/scripts/validate-block-15-controlled-kaykit.mjs
      - name: Verify TypeScript
        run: pnpm --filter @workspace/dungeon-rpg typecheck
      - name: Build production output
        run: BASE_PATH=/DungeonVeil/ pnpm --dir artifacts/dungeon-rpg run build
