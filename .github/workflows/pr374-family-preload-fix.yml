name: PR374 Family Preload Fix

on:
  push:
    branches:
      - feat/enemy-family-presentation-v2

permissions:
  contents: write

jobs:
  apply-focused-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enemy-family-presentation-v2
          fetch-depth: 0
      - name: Remove coarse imported-carrier preload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/dungeon-rpg/src/components/kaykitEnemy3D.ts')
          source = path.read_text()
          source = source.replace("const ENEMY_ASSET_FETCH_ATTEMPTS = 4;\n", "")

          source, removed_probe = re.subn(
              r"\nasync function preloadLocalEnemyAsset\(type: \(typeof IMPORTED_ENEMY_TYPES\)\[number\]\) \{.*?\n\}\n\nfunction clipName",
              "\nfunction clipName",
              source,
              count=1,
              flags=re.S,
          )
          if removed_probe != 1:
              raise SystemExit('preloadLocalEnemyAsset block was not found exactly once')

          old = """async function preloadRealCreatureModels(types: readonly (typeof IMPORTED_ENEMY_TYPES)[number][]) {
            if (!types.length) return;
            await Promise.all(types.map(preloadLocalEnemyAsset));
            await Promise.all(types.map(loadImportedPrototype));
          }
          """
          new = """async function preloadRealCreatureModels(types: readonly (typeof IMPORTED_ENEMY_TYPES)[number][]) {
            // Runtime enemy types are coarse simulation carriers and can resolve to
            // humanoid family profiles. Eagerly decoding every carrier here made
            // WebKit download unused Rat/Bat prototypes beside the full KayKit
            // library and could keep the run preparation screen alive indefinitely.
            // Imported prototypes are cached by loadImportedPrototype and now load
            // only when createDedicatedImportedVisual receives an actual family
            // profile with useImported=true.
            void types;
          }
          """
          if source.count(old) != 1:
              raise SystemExit('preloadRealCreatureModels block was not found exactly once')
          source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pr374-family-preload-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/dungeon-rpg/src/components/kaykitEnemy3D.ts .github/workflows/pr374-family-preload-fix.yml
          git commit -m "Fix family-aware enemy asset staging"
          git push origin HEAD:feat/enemy-family-presentation-v2
