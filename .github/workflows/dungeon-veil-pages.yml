name: Deploy Dungeon Veil Test Site

# Deploy review branches to the shared project-root test site.
on:
  push:
    branches:
      - work/blocks-1-7-production-pass
      - 'fix/**'
      - 'work/block-*'
      - test/final-balance-integration
    paths-ignore:
      - '.ci/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: dungeon-veil-pages
  cancel-in-progress: true

jobs:
  build:
    # The final integration branch requires an explicit deployment approval marker.
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'test/final-balance-integration' || contains(github.event.head_commit.message, '[deploy-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      product_sha: ${{ steps.product.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve product commit
        id: product
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for required integration validations
        if: github.ref_name == 'test/final-balance-integration'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const required = ['Dungeon RPG CI', 'Dungeon RPG Check', 'Full Game Regression'];
            const failedConclusions = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'stale']);
            const deadline = Date.now() + 50 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const { owner, repo } = context.repo;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: context.sha,
                per_page: 100,
              });
              const latest = new Map();
              for (const run of data.workflow_runs) {
                if (!required.includes(run.name)) continue;
                const previous = latest.get(run.name);
                if (!previous || new Date(run.created_at) > new Date(previous.created_at)) latest.set(run.name, run);
              }

              const states = required.map(name => {
                const run = latest.get(name);
                return { name, status: run?.status || 'missing', conclusion: run?.conclusion || null };
              });
              core.info(`Validation states: ${JSON.stringify(states)}`);

              const failed = states.find(state => state.status === 'completed' && failedConclusions.has(state.conclusion));
              if (failed) throw new Error(`${failed.name} finished with ${failed.conclusion}`);

              if (states.every(state => state.status === 'completed' && state.conclusion === 'success')) {
                core.info(`All required validations passed for ${context.sha}`);
                return;
              }
              await sleep(30_000);
            }
            throw new Error(`Timed out waiting for required validations on ${context.sha}`);

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Asset audit
        run: pnpm --filter @workspace/dungeon-rpg audit:assets

      - name: Room and collision audit
        run: pnpm --filter @workspace/dungeon-rpg audit:rooms

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build Dungeon Veil for GitHub Pages
        env:
          BASE_PATH: /DungeonVeil/
          NODE_ENV: production
          VITE_BUILD_SHA: ${{ steps.product.outputs.sha }}
        run: pnpm --dir artifacts/dungeon-rpg run build

      - name: Verify GitHub Pages artifact
        env:
          EXPECTED_BASE_PATH: /DungeonVeil/
        run: pnpm --filter @workspace/dungeon-rpg audit:pages

      - name: Write deployment marker
        shell: bash
        run: |
          printf '{"commit":"%s","deployedAt":"%s"}\n' "${{ steps.product.outputs.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/dungeon-rpg/dist/public/deployment.json

      - name: Disable Jekyll processing
        run: touch artifacts/dungeon-rpg/dist/public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/dungeon-rpg/dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-pages:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Summarize deployment result without modifying repository branches
        shell: bash
        env:
          PRODUCT_SHA: ${{ needs.build.outputs.product_sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          {
            echo "## Dungeon Veil Pages deployment"
            echo "- Product commit: \`${PRODUCT_SHA:-not built}\`"
            echo "- Build: \`${BUILD_RESULT}\`"
            echo "- Deployment: \`${DEPLOY_RESULT}\`"
            echo "- Page URL: ${PAGE_URL:-https://ys2mm422yb-max.github.io/DungeonVeil/}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist exact deployment receipt in autopilot control issue
        if: needs.build.result == 'success' && needs.deploy.result == 'success' && github.ref == 'refs/heads/fix/mobile-telegraphs-room-21-50-balance'
        uses: actions/github-script@v7
        env:
          PRODUCT_SHA: ${{ needs.build.outputs.product_sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = 376;
            const productSha = process.env.PRODUCT_SHA;
            const pageUrl = process.env.PAGE_URL || 'https://ys2mm422yb-max.github.io/DungeonVeil/';
            const runAttempt = process.env.WORKFLOW_RUN_ATTEMPT;
            if (!productSha) throw new Error('Missing deployed product SHA; refusing to write a success receipt.');
            if (!runAttempt || !/^\d+$/.test(runAttempt)) throw new Error('Missing concrete workflow run attempt; refusing to write a success receipt.');

            const marker = `<!-- dungeon-veil-pages-deployment-receipt:${productSha} -->`;
            const body = [
              marker,
              '### Dungeon Veil Pages deployment receipt',
              `- status: \`success\``,
              `- product_sha: \`${productSha}\``,
              `- workflow_run_id: \`${context.runId}\``,
              `- workflow_run_attempt: \`${runAttempt}\``,
              `- ref: \`${context.ref}\``,
              `- page_url: ${pageUrl}`,
              `- recorded_at: \`${new Date().toISOString()}\``,
              '',
              'This receipt is emitted only after both the existing Pages build and deploy jobs succeed on the fixed target branch. A rerun for the same product SHA updates this receipt instead of creating a duplicate.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated deployment receipt for ${productSha} in #${issueNumber}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
              core.info(`Created deployment receipt for ${productSha} in #${issueNumber}`);
            }
